<title>Vadi At Çiftliği</title>
<script>
/* Telefon görünümü: iPhone'da (veya dar ekranda) html'e "phone" sınıfı eklenir.
   Safari sayfayı uzaklaştırılmış açarsa (yakınlaştırma ayarı) uygulama telefonun
   gerçek genişliğine ölçeklenir; durum çubuğu payı gelmezse elle verilir. */
(function(){
  var de = document.documentElement;
  var ua = navigator.userAgent, small = Math.min(screen.width, screen.height) <= 440;
  /* Safari "masaüstü sitesi" modunda iPhone kendini Mac diye tanıtır: dokunmatik + küçük ekran ise yine iPhone say */
  var iphone = /iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1 && small);
  function fit(){
    de.style.zoom = '';
    var land = Math.abs(window.orientation||0) === 90 || innerWidth > innerHeight;
    var phone = iphone || window.innerWidth <= 520;
    de.classList.toggle('phone', phone);
    if(iphone && !land){
      var sw = Math.min(screen.width, screen.height);
      var target = sw >= 320 && sw <= 440 ? sw : 393;
      var r = window.innerWidth / target;
      if(r > 1.08) de.style.zoom = r.toFixed(3);
    }
    if(iphone && document.body){
      var p = document.createElement('div');
      p.style.cssText = 'position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden';
      document.body.appendChild(p);
      var t = parseFloat(getComputedStyle(p).paddingTop) || 0;
      p.remove();
      var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
      if(standalone && !land && t * (parseFloat(de.style.zoom)||1) < 30) de.style.setProperty('--safe-t', '59px');
      else de.style.removeProperty('--safe-t');
    }
  }
  fit();
  document.addEventListener('DOMContentLoaded', fit);
  var lastW = innerWidth;
  window.addEventListener('resize', function(){ if(innerWidth === lastW) return; lastW = innerWidth; clearTimeout(fit._t); fit._t = setTimeout(fit, 150); });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
})();
</script>
<style>
:root{
  --bg:#f5f2ec; --card:#fff; --ink:#1b2335; --muted:#667085; --line:#e2ddd4;
  --brand:#1a2b4a; --brand2:#b5743f; --taba:#b5743f; --tabaLight:#f6ebdf; --navy2:#2c3f66; --ok:#2f7d4f; --warn:#b7791f; --bad:#b33a3a; --info:#2f5d8a;
  --okbg:#e6f3eb; --warnbg:#fbf1df; --badbg:#f8e5e5; --infobg:#e3edf7; --tur:#7a4fa0; --turbg:#efe7f6;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;
  padding-bottom:calc(74px + var(--safe-b))}
/* üst çubuk */
.appbar{position:sticky;top:0;z-index:5;background:var(--brand);border-bottom:2px solid var(--taba);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px}
.appbar .logo{width:38px;height:38px;border-radius:10px;background:var(--brand);border:1px solid rgba(181,116,64,.55);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:22px}
.appbar .logo img{width:100%;height:100%;object-fit:contain}
.appbar h1{font-size:17px;margin:0;font-weight:650;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar small{display:block;font-size:12px;font-weight:400;opacity:.8}
.appbar .back{background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.appbar .user{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
/* alt sekme çubuğu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 14px rgba(20,30,52,.06), 0 80px 0 0 #fff}
.tabbar button{flex:1;max-width:120px;background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.tabbar button .i{font-size:23px;line-height:1;display:flex}
.tabbar button.active{color:var(--brand);font-weight:700}
.tabbar button.add .i{background:var(--taba);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-18px;box-shadow:0 4px 12px rgba(26,43,74,.35)}
main{max-width:1100px;margin:0 auto;padding:16px 14px}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
h3 > .ico:first-child,h2 .badge .ico{color:var(--brand2);margin-right:4px}
.btn .ico{font-size:1.1em}
.ph .ico{stroke-width:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.stat{font-size:26px;font-weight:700;color:var(--brand)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button.btn,label.btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px;min-height:42px;font-weight:550}
button.btn:active{transform:scale(.98)}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
button.sm{padding:6px 11px;font-size:13px;min-height:34px;border-radius:8px}
button.danger{background:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
tr.click{cursor:pointer}
tr.click:active{background:#faf7f2}
.tablewrap{overflow-x:auto}
/* telefonda tablolar kart olur */
@media(max-width:700px){
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr:first-child:has(th){display:none}
  table.resp tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
  table.resp td{border:0;padding:3px 0}
  table.resp td:empty{display:none}
}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)} .b-info{background:var(--infobg);color:var(--info)}
.b-mut{background:#eee;color:#666} .b-tur{background:var(--turbg);color:var(--tur)}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;display:flex;min-width:120px}
.bar span{display:block;height:100%}
.bar .u{background:var(--ok)} .bar .p{background:#9cc3e6}
/* ana sayfa kutucukları */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
@media(max-width:420px){.tiles{grid-template-columns:1fr 1fr;gap:10px}}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:112px;font:inherit;color:var(--ink);position:relative}
.tile:active{transform:scale(.98)}
.tile .i{width:44px;height:44px;border-radius:12px;background:var(--tabaLight);color:var(--taba);display:flex;align-items:center;justify-content:center;font-size:23px}
.tile b{font-size:15px}
.tile .muted{font-size:12px}
.tile .cnt{position:absolute;top:12px;right:12px;background:var(--brand);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.tile .lk{position:absolute;bottom:12px;right:12px;color:var(--muted);font-size:14px;display:flex}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello h2{margin:0}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:160px;padding:8px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--brand2);box-shadow:0 0 0 2px #ecd5bd}
.dayhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;gap:4px;flex-wrap:wrap}
.chip{border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;border-left:3px solid}
.chip.plan{background:var(--infobg);border-color:var(--info)}
.chip.tamam{background:var(--okbg);border-color:var(--ok)}
.chip.gelmedi{background:var(--warnbg);border-color:var(--warn)}
.chip.iptal{background:#f0f0f0;border-color:#999;text-decoration:line-through;color:#777}
.chip.tur{background:var(--turbg);border-color:var(--tur)}
.chip.tur.iptal{background:#f0f0f0;border-color:#999}
.chip b{display:block}
@media(max-width:900px){.week{grid-template-columns:1fr}.day{min-height:auto}}
/* modal: telefonda tam ekran */
.modal-bg{position:fixed;inset:0;background:rgba(14,22,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:10}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:20px}
.modal.wide{max-width:880px}
@media(max-width:600px){
  .modal-bg{padding:0;align-items:stretch}
  .modal,.modal.wide{border-radius:0;min-height:100%;padding:calc(16px + var(--safe-t)) 16px calc(24px + var(--safe-b))}
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px 2px;margin:0 0 14px}
legend{font-weight:700;font-size:14px;padding:0 6px;color:var(--brand)}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);background:#1c2b4a;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px}
.cafe-res{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.7}
.cafe-res:empty{display:none}
.cafe-res.ok{background:var(--okbg);color:var(--ok)} .cafe-res.no{background:#f8e5e3;color:var(--bad)}
.occ{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.occ .bar{height:10px;background:#efe5d8;border-radius:999px;overflow:hidden} .occ .bar i{display:block;height:100%;border-radius:999px}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:14px}
.lessons{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.lessons i{width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;background:#eee;color:#888}
.lessons i.u{background:var(--ok);color:#fff} .lessons i.n{background:var(--warn);color:#fff} .lessons i.p{background:#9cc3e6;color:#fff}
/* at künyesi */
.horses{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media(max-width:420px){.horses{grid-template-columns:1fr 1fr;gap:10px}}
.hcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.hcard .ph{aspect-ratio:4/3;background:#f8f1e8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px;color:#c9b8a4}
.hcard .tx{padding:10px 12px}
.hcard b{display:block;font-size:15px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:#efe5d8 center/cover no-repeat;aspect-ratio:16/9;max-height:380px;width:100%;display:flex;align-items:flex-end;margin-bottom:14px}
.hero.noimg{aspect-ratio:auto;min-height:170px;background:linear-gradient(135deg,var(--brand),var(--navy2))}
.hero .at-hero{position:absolute;right:14px;top:12px;height:calc(100% - 24px);max-height:220px;width:auto;opacity:.95;pointer-events:none}
.hero .cap{position:relative}
.ph .at-ph{height:80%;width:auto;max-width:90%;object-fit:contain}
.photo-in .ph .at-ph{height:86%}
.hero .cap{width:100%;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.hero h2{margin:0;font-size:26px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:2px 16px}
.kv div{padding:7px 0;border-bottom:1px dashed var(--line)}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:600}
.photo-in{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.photo-in .ph{width:110px;height:84px;border-radius:12px;background:#f8f1e8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px;color:#c9b8a4;flex:none}
/* giriş ekranı */
.login{max-width:420px;margin:30px auto;text-align:center}
.login .logo-big{width:200px;height:200px;border-radius:22px;background:var(--brand);border:0;box-shadow:0 6px 20px rgba(26,43,74,.18);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}
.login .logo-big img{width:100%;height:100%;object-fit:contain}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.users button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 8px;font:inherit;cursor:pointer}
.users button.sel{border-color:var(--brand);box-shadow:0 0 0 2px #ecd5bd}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}
.pin i.f{background:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.keypad button:active{background:#f3ede5}
/* yetki: personel ücretleri göremez */
body.role-personel .money{display:none!important}
body.nologin .tabbar,body.nologin .appbar .user{display:none}

/* ============ iPhone arayüzü (telefon genişliği) ============ */
/* telefon görünümü: html.phone sınıfıyla açılır (iPhone veya dar ekran) */
html.phone{--bg:#f3f0ea; --line:#e2ddd4}
html.phone,html.phone body{overscroll-behavior-y:none}
html.phone body{font-size:16px;padding-bottom:calc(62px + var(--safe-b));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.phone input,html.phone textarea,html.phone select,html.phone [contenteditable],html.phone .kv,html.phone td,html.phone .muted{-webkit-user-select:text;user-select:text}
html.phone .appbar{background:rgba(26,43,74,.94);-webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px); padding:calc(6px + var(--safe-t)) 10px 6px;min-height:calc(50px + var(--safe-t));gap:8px}
html.phone .appbar .logo{width:32px;height:32px;border-radius:8px;font-size:19px}
html.phone body:not(.at-home) .appbar .logo{display:none}
html.phone .appbar .back{background:none;width:auto;height:38px;padding:0 6px 0 0;font-size:34px;font-weight:300;line-height:1;display:flex;align-items:center}
html.phone body:not(.at-home) .appbar h1{position:absolute;left:64px;right:64px;text-align:center;bottom:6px;line-height:38px}
html.phone body:not(.at-home) #farm-name{display:none}
html.phone body:not(.at-home) .appbar small{display:inline;font-size:17px;font-weight:600;opacity:1}
html.phone .appbar .user{padding:6px 10px;font-size:13px}
html.phone main{padding:14px 16px 20px}
html.phone .hello{margin:4px 0 16px}
html.phone .hello h2{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
html.phone .hello .muted{font-size:14px;margin-top:4px}
html.phone h2{font-size:24px;letter-spacing:-.01em}
html.phone .card{border:0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,52,.05)}
html.phone .tiles{display:block;background:#fff;border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,30,52,.05)}
html.phone .tile{display:grid;grid-template-columns:34px 1fr auto 12px;grid-template-areas:"i b x c" "i m x c";column-gap:14px;row-gap:1px;align-items:center; width:100%;min-height:62px;padding:10px 16px;border:0;border-radius:0;background:#fff;position:relative}
html.phone .tile + .tile::before{content:'';position:absolute;top:0;left:64px;right:0;height:1px;background:var(--line);transform:scaleY(.6)}
html.phone .tile:active{transform:none;background:#ebe6dd}
html.phone .tile .i{grid-area:i;width:34px;height:34px;border-radius:9px;font-size:19px;color:#fff;background:var(--brand)}
html.phone .tile b{grid-area:b;font-size:16px;font-weight:600;align-self:end}
html.phone .tile .muted{grid-area:m;font-size:13px;align-self:start}
html.phone .tile .cnt,html.phone .tile .lk{grid-area:x;position:static;align-self:center}
html.phone .tile::after{content:'';grid-area:c;width:8px;height:8px;border-top:2px solid #c3b9ad;border-right:2px solid #c3b9ad;transform:rotate(45deg);justify-self:start}
html.phone .tile:nth-child(8n+1) .i{background:#1a2b4a} html.phone .tile:nth-child(8n+2) .i{background:#b5743f} html.phone .tile:nth-child(8n+3) .i{background:#3a5683} html.phone .tile:nth-child(8n+4) .i{background:#8c5530} html.phone .tile:nth-child(8n+5) .i{background:#24375c} html.phone .tile:nth-child(8n+6) .i{background:#c58a55} html.phone .tile:nth-child(8n+7) .i{background:#4a6591} html.phone .tile:nth-child(8n+8) .i{background:#a0623a}
html.phone .tabbar{background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px); border-top:.5px solid rgba(20,30,52,.18);box-shadow:0 80px 0 0 rgba(255,255,255,.95);padding:5px 2px calc(4px + var(--safe-b))}
html.phone .tabbar button{font-size:10.5px;font-weight:500;gap:3px;padding:2px 0}
html.phone .tabbar button .i{font-size:25px;height:28px;align-items:center}
html.phone .tabbar button.active{font-weight:600}
html.phone .tabbar button.add .i{width:30px;height:30px;margin:0;font-size:19px;box-shadow:none;border-radius:50%}
html.phone button.btn,html.phone label.btn{min-height:46px;border-radius:12px;font-size:16px}
html.phone button.sm{min-height:36px;font-size:14px}
html.phone input,html.phone select,html.phone textarea{min-height:46px;border-radius:12px}
html.phone main .row > input:not([type=checkbox]):not([type=radio]),html.phone main .row > select{max-width:none!important;flex:1 1 140px;width:auto}
html.phone .modal-bg{padding:0;align-items:stretch;background:#fff}
html.phone .modal,html.phone .modal.wide{border-radius:0;min-height:100%;max-width:none;padding:0 16px calc(24px + var(--safe-b));position:relative;animation:pageIn .25s cubic-bezier(.2,.8,.2,1)}
html.phone .mbar{display:flex;align-items:center;position:sticky;top:0;z-index:3;margin:0 -16px 16px;background:rgba(26,43,74,.96);color:#fff;padding:calc(6px + var(--safe-t)) 10px 6px;min-height:calc(50px + var(--safe-t))}
html.phone .mbar .back{background:none;border:0;color:#fff;font-size:34px;font-weight:300;line-height:1;height:38px;padding:0 10px 0 0;cursor:pointer}
html.phone .mbar .t{position:absolute;left:60px;right:60px;bottom:6px;line-height:38px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .modal h3.mh{display:none}
html.phone .modal .tiles{box-shadow:none;border:1px solid var(--line)}
html.phone .toast{bottom:calc(74px + var(--safe-b));border-radius:12px}

html.phone table.resp,html.phone table.resp tbody,html.phone table.resp tr,html.phone table.resp td{display:block;width:100%}

html.phone .week{grid-template-columns:1fr} html.phone .day{min-height:auto}

.mbar{display:none}

.cl-dot.ok{background:#5cc06a}.cl-dot.bekliyor{background:#f0b400}.cl-dot.hata{background:#e5533d}
@keyframes sheetUp{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
</style>

<script>
/* ================== VERİ ================== */
const APP_VER = '17 · 27.11';
const KEY = 'vadi-at-ciftligi-v1';
const STATUS = {
  plan:    {t:'Planlandı', c:'b-info'},
  tamam:   {t:'Tamamlandı', c:'b-ok'},
  gelmedi: {t:'Gelmedi', c:'b-warn'},
  iptal:   {t:'İptal', c:'b-mut'},
};
function defaults(){
  return {
    settings:{ noShowCounts:true, defaultDuration:60, farmName:'Vadi At Çiftliği', logo:'' },
    users:[],
    packages:[
      {id:'p10', name:'3 Ay · 10 Ders', lessons:10, months:3, price:0},
      {id:'p20', name:'3 Ay · 20 Ders', lessons:20, months:3, price:0},
    ],
    students:[], enrollments:[], bookings:[],
    horses:[], trainers:[],
    owners:[], boarders:[], charges:[],
    services:[
      {id:'tur',   name:'Doğa Turu',        duration:60, price:0},
      {id:'manej', name:'Manej (tek ders)', duration:30, price:0},
    ],
    visits:[],
    cafe:{ tables:[...[4,4,4,4,4,4,2,2].map((n,i)=>({id:'ci'+(i+1), name:'İ'+(i+1), area:'ic', seats:n})),
                   ...[4,4,4,4,4,4,4,4,4,4,6,6].map((n,i)=>({id:'cd'+(i+1), name:'D'+(i+1), area:'dis', seats:n}))],
           summer:[5,6,7,8,9,10], sOpen:'09:00', sClose:'23:00', wOpen:'09:00', wClose:'21:00', stay:120, configured:false, outClosed:[] },
    cafeRes:[],
  };
}
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){ S = defaults(); }
S.settings = Object.assign(defaults().settings, S.settings);
S.cafe = Object.assign(defaults().cafe, S.cafe);
/* Vadi At Çiftliği'nin kendi atları (ilk açılışta bir kez eklenir; müşteri verisi değil, yayında da var) */
if(!S.seededOwnHorses){
  const t = new Date(); const d0 = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-01`;
  const own = [['Rüzgar'],['Safir'],['Çarli'],['Bozok'],['Bozkır'],['Aras'],['Şimşek'],
    ['Boldi','Manej','Sadece manej alanında kullanılıyor. Manej fiyatı diğer atlardan farklı.'],
    ['Poni'],['Poyraz'],['Esanadolu'],['Ulubey']];
  own.forEach(([name, role, note], i)=>{
    if(S.boarders.some(h=>h.own && h.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))) return;
    S.boarders.push({id:'v'+i+Date.now().toString(36), own:true, ownerId:'', name, role:role||'', breed:'', gender:'', birthYear:'', box:'',
      startDate:d0, endDate:'', monthlyFee:0, services:[], nextFarrier:'', nextVaccine:'', nextDeworm:'', vet:'', note:note||'', photo:'', log:[], created:d0});
  });
  S.seededOwnHorses = true;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); if(window.CLOUD_ON && window.CL && CL.ready) schedulePush(); return true; }
  catch(e){ if(e && /quota/i.test(e.name+e.message)){ alert('Cihaz hafızası doldu (fotoğraflar çok yer kaplıyor olabilir). Değişiklik kaydedilemedi.'); }
    else toast('Kaydedilemedi!'); return false; } }
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ================== YARDIMCILAR ================== */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
function addMonths(s, n){ const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)-1); return ymd(d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const fmt = s => { if(!s) return '-'; const d=parse(s); return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d=parse(s); return `${d.getDate()} ${AY[d.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('tr-TR') + ' ₺';
const $ = s => document.querySelector(s);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function mondayOf(s){ const d=parse(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); }

const student = id => S.students.find(x=>x.id===id);
const enrollment = id => S.enrollments.find(x=>x.id===id);
const pkg = id => S.packages.find(x=>x.id===id);

function counts(e, excludeBookingId){
  const bs = S.bookings.filter(b=>b.enrollmentId===e.id && b.id!==excludeBookingId);
  const done = bs.filter(b=>b.status==='tamam').length;
  const noshow = bs.filter(b=>b.status==='gelmedi').length;
  const prior = +e.priorUsed || 0; // panel öncesi (defterden) yapılan dersler
  const used = prior + done + (S.settings.noShowCounts ? noshow : 0);
  const planned = bs.filter(b=>b.status==='plan').length;
  const remaining = e.lessons - used - planned;
  return {prior, done, noshow, used, planned, remaining};
}
function enrollState(e){
  const c = counts(e);
  if (e.frozen) return {k:'dondu', t:'Donduruldu', c:'b-mut'};
  if (c.used >= e.lessons) return {k:'bitti', t:'Tamamlandı', c:'b-ok'};
  if (today() > e.endDate) return {k:'sure', t:'Süresi doldu', c:'b-bad'};
  const daysLeft = (parse(e.endDate) - parse(today()))/864e5;
  if (daysLeft <= 14) return {k:'yakin', t:`${Math.round(daysLeft)} gün kaldı`, c:'b-warn'};
  return {k:'aktif', t:'Aktif', c:'b-info'};
}
function bar(e){
  const c = counts(e);
  return `<div class="bar" title="${c.used} kullanıldı, ${c.planned} planlı, ${Math.max(0,c.remaining)} boş">
    <span class="u" style="width:${c.used/e.lessons*100}%"></span>
    <span class="p" style="width:${c.planned/e.lessons*100}%"></span></div>`;
}
function lessonNo(b){ // ders numarası (kaçıncı ders)
  const list = S.bookings.filter(x=>x.enrollmentId===b.enrollmentId && x.status!=='iptal')
    .sort((a,c)=> (a.date+a.time).localeCompare(c.date+c.time));
  return (+(enrollment(b.enrollmentId)?.priorUsed)||0) + list.findIndex(x=>x.id===b.id)+1;
}
function bookingLabel(b){
  const e = enrollment(b.enrollmentId); const s = e && student(e.studentId);
  return {name: s ? s.name : '(silinmiş)', e};
}

/* ================== GÖRÜNÜMLER / GEZİNME ================== */
let view = 'home', viewArg = null;
let weekStart = mondayOf(today());
let filter = {q:'', status:'all', from:'', to:''};
let kFilter = {q:'', state:'all'};
const VIEWS = {
  home:{t:'Ana Sayfa', f:()=>vHome()},
  panel:{t:'Bugün', f:()=>vPanel()},
  takvim:{t:'Takvim', f:()=>vTakvim()},
  kursiyer:{t:'Kursiyerler', f:()=>vKursiyer()},
  rezervasyon:{t:'Rezervasyonlar', f:()=>vRezervasyon()},
  tur:{t:'Tur & Tek Ders', f:()=>vTur()},
  cafe:{t:'Cafe & Restoran', f:()=>vCafe()},
  atlar:{t:'At Künyeleri', f:()=>vAtlar()},
  at:{t:'At Künyesi', f:()=>vAt(viewArg)},
  pansiyon:{t:'Pansiyon & Sahipler', f:()=>vPansiyon()},
  odemeler:{t:'Ücret & Ödemeler', f:()=>vOdemeler(), admin:true},
  ayarlar:{t:'Ayarlar', f:()=>vAyarlar(), admin:true},
};
function go(v, arg){ view = v; viewArg = arg ?? null; closeModal(); render(); window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+v+(arg?'/'+arg:'')); }catch(e){} }
function render(){
  applyBrand();
  const u = me();
  document.body.classList.toggle('nologin', !u);
  if(!u){ $('#app').innerHTML = vLogin(); $('#page-title').textContent = 'Giriş'; $('#back').style.display='none'; return; }
  document.body.classList.toggle('role-personel', !isAdmin());
  if(!VIEWS[view] || (VIEWS[view].admin && !isAdmin())) view = 'home';
  $('#page-title').textContent = VIEWS[view].t;
  $('#back').style.display = view==='home' ? 'none' : '';
  document.body.classList.toggle('at-home', view==='home');
  $('#userchip').innerHTML = ic(isAdmin()?'shield':'user') + ' ' + esc(u.name.split(' ')[0]) + (CLOUD_ON ? `<span id="cl-dot" class="cl-dot ${CL.status}"></span>` : '');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.v===view || (view==='at' && b.dataset.v==='atlar')));
  $('#app').innerHTML = VIEWS[view].f();
}
document.getElementById('tabbar').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  b.dataset.v==='_add' ? openQuickAdd() : go(b.dataset.v); });
document.getElementById('back').onclick = () => go(view==='at' ? 'atlar' : 'home');

  </div>
  <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn ghost" onclick="closeModal()">Kapat</button></div>`);
}

const AT_IMG = '<img class="at-ph" src="at-ikon.png" alt="">';
const ic = (n, cls='ico') => n==='horse' ? `<span class="${cls} ico-at" aria-hidden="true"></span>` :
  ((n, cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`)(n, cls);
function tile(icon, title, sub, action, opts={}){
  return `<button class="tile ${opts.lock?'lock':''} ${opts.cls||''}" onclick="${action}">${opts.cnt?`<span class="cnt">${opts.cnt}</span>`:''}
    <span class="i">${ic(icon)}</span><b>${title}</b><span class="muted">${sub||''}</span>${opts.lock?`<span class="lk">${ic('lock')}</span>`:''}</button>`;
}

function vHome(){
  const t = today(), u = me();
  const nLessons = S.bookings.filter(b=>b.date===t && b.status!=='iptal').length;
  const nVisits = S.visits.filter(v=>v.date===t && v.status!=='iptal').length;
  const care = careDue(14).length;
  const activeStu = S.enrollments.filter(e=>['aktif','yakin'].includes(enrollState(e).k)).length;
  const horses = S.boarders.filter(h=>boarderActive(h)).length;
  const hr = new Date().getHours();
  const greet = hr<12 ? 'Günaydın' : hr<18 ? 'İyi günler' : 'İyi akşamlar';
  const alacak = isAdmin() ? totalReceivable() : 0;
  return `
  <div class="hello"><div><h2>${greet}, ${esc(u.name.split(' ')[0])}</h2>
    <div class="muted">${GUN[new Date().getDay()]}, ${fmt(t)} · Bugün ${nLessons} ders, ${nVisits} tur</div></div></div>
  ${cloudHomeCard()}
  ${isAdmin() && window._veriVar && !S.students.length && !S.seededStudents ? `<div class="card" style="border-left:4px solid var(--warn)"><b>Kayıtlı veriler bu telefonda yok</b>
    <div class="muted" style="margin:4px 0 10px">Kursiyerleri ve pansiyon atlarını şifreyle yükleyin.</div>
    <button class="btn" onclick="openRealDataForm()">${ic('lock')} Gerçek verileri yükle</button></div>` : ''}
  <div class="tiles">
    ${tile('sun','Bugün', `${nLessons} ders · ${nVisits} tur`, "go('panel')", {cnt:(nLessons+nVisits)||''})}
    ${tile('calendar','Takvim','Haftalık program',"go('takvim')")}
    ${tile('book','Ders rezervasyonu','Paketli kursiyer',"openBooking({date:today()})")}
    ${tile('tree','Tur & Tek Ders','Doğa turu · manej',"go('tur')")}
    ${tile('cup','Cafe & Restoran', `${S.cafeRes.filter(r=>r.date===t && CAFE_ACTIVE.includes(r.status)).length} rezervasyon bugün`,"go('cafe')", {cnt:S.cafeRes.filter(r=>r.status==='bekliyor' && r.date>=t).length?S.cafeRes.filter(r=>r.status==='bekliyor' && r.date>=t).length+' onay':''})}
    ${tile('users','Kursiyerler', `${activeStu} aktif paket`,"go('kursiyer')")}
    ${tile('clipboard','Rezervasyonlar','Tüm dersler',"go('rezervasyon')")}
    ${tile('horse','At Künyeleri', `${horses} at · fotoğraf, pedigri`,"go('atlar')", {cnt:care?(care+' bakım'):''})}
    ${tile('barn','Pansiyon','Sahipler ve atlar',"go('pansiyon')")}
    ${isAdmin()?tile('wallet','Ücret & Ödemeler', alacak?`Bekleyen ${money(alacak)}`:'Tahsilat takibi',"go('odemeler')",{lock:true}):''}
    ${isAdmin()?tile('settings','Ayarlar','Kullanıcılar, logo, fiyatlar',"go('ayarlar')",{lock:true}):''}
  </div>
  ${vTodayList()}
  <div class="muted" style="text-align:center;font-size:11px;margin-top:8px">Sürüm ${APP_VER}</div>`;
}
function vTodayList(){
  const t = today();
  const items = [
    ...S.bookings.filter(b=>b.date===t && b.status!=='iptal').map(b=>({k:'b',time:b.time,x:b})),
    ...S.visits.filter(v=>v.date===t && v.status!=='iptal').map(v=>({k:'v',time:v.time,x:v})),
  ].sort((a,b)=>a.time.localeCompare(b.time));
  return `<div class="card"><div class="row"><h3 style="margin:0">Bugünün programı</h3><span class="spacer"></span>
    <button class="btn ghost sm" onclick="go('panel')">Tümü ›</button></div>
    ${items.length?`<table style="margin-top:6px">${items.map(({k,x})=>{
      if(k==='b'){ const {name,e}=bookingLabel(x); return `<tr><td style="width:56px"><b>${x.time}</b></td><td>${esc(name)}<div class="muted">${lessonNo(x)}. ders / ${e?.lessons??'-'}${x.horse?' · '+ic('horse')+' '+esc(x.horse):''}</div></td>
        <td style="text-align:right;white-space:nowrap">${x.status==='plan'?`<button class="btn sm" onclick="setStatus('${x.id}','tamam')">${ic('check')} Geldi</button>`:`<span class="badge ${STATUS[x.status].c}">${STATUS[x.status].t}</span>`}</td></tr>`; }
      return `<tr><td><b>${x.time}</b></td><td>${esc(x.name)} <span class="badge b-tur">${esc(x.serviceName)}</span><div class="muted">${x.people||1} kişi${x.horse?' · '+ic('horse')+' '+esc(x.horse):''}</div></td>
        <td style="text-align:right;white-space:nowrap">${x.status==='plan'?`<button class="btn sm" onclick="setVisit('${x.id}','tamam')">${ic('check')} Geldi</button>`:`<span class="badge ${STATUS[x.status].c}">${STATUS[x.status].t}</span>`}</td></tr>`;
    }).join('')}</table>`:`<div class="empty">Bugün için program yok.</div>`}</div>`;
}

function vPanel(){
  const t = today();
  const todays = S.bookings.filter(b=>b.date===t && b.status!=='iptal').sort((a,b)=>a.time.localeCompare(b.time));
  const todayVisits = S.visits.filter(v=>v.date===t && v.status!=='iptal').sort((a,b)=>a.time.localeCompare(b.time));
  const active = S.enrollments.filter(e=>['aktif','yakin'].includes(enrollState(e).k));
  const expiring = S.enrollments.filter(e=>enrollState(e).k==='yakin');
  const low = active.filter(e=>{const c=counts(e); return e.lessons-c.used<=2;});
  const unplanned = active.filter(e=>counts(e).planned===0 && counts(e).remaining>0);
  const wk = mondayOf(t), wkEnd = addDays(wk,6);
  const weekCount = [...S.bookings, ...S.visits].filter(b=>b.date>=wk && b.date<=wkEnd && b.status!=='iptal').length;
  const debt = S.enrollments.reduce((a,e)=>a+Math.max(0,(+e.price||0)-(+e.paid||0)),0);
  const bDebt = S.charges.filter(c=>!c.paid).reduce((a,c)=>a+(+c.amount||0),0);
  const care = careDue(14);

  const row = e => { const s=student(e.studentId), c=counts(e), st=enrollState(e);
    return `<tr class="click" onclick="openStudent('${e.studentId}')"><td>${esc(s?.name)}</td><td>${esc(e.packageName)}</td>
      <td>${c.used}/${e.lessons}</td><td>${fmtShort(e.endDate)}</td><td><span class="badge ${st.c}">${st.t}</span></td></tr>`; };

  return `
  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Bugün</h2><span class="spacer"></span>
    <button class="btn ghost" onclick="openStudentForm()">+ Kursiyer</button>
    <button class="btn" onclick="openBooking({date:'${t}'})">+ Rezervasyon</button></div>
  <div class="grid g4">
    <div class="card"><div class="muted">Bugünkü dersler</div><div class="stat">${todays.length}</div>${todayVisits.length?`<div class="muted">+ ${todayVisits.length} tur / tek ders</div>`:''}</div>
    <div class="card"><div class="muted">Bu hafta rezervasyon</div><div class="stat">${weekCount}</div></div>
    <div class="card"><div class="muted">Aktif paket</div><div class="stat">${active.length}</div></div>
    <div class="card money"><div class="muted">Ders tahsilatı bekleyen</div><div class="stat" style="color:${debt?'var(--bad)':'var(--brand)'}">${money(debt)}</div></div>
    <div class="card"><div class="muted">Pansiyondaki at</div><div class="stat">${pensionHorses().filter(h=>boarderActive(h)).length}</div></div>
    <div class="card money"><div class="muted">Pansiyon tahsilatı bekleyen</div><div class="stat" style="color:${bDebt?'var(--bad)':'var(--brand)'}">${money(bDebt)}</div></div>
  </div>
  ${care.length?`<div class="card"><h3>${ic('health')} Yaklaşan bakım (14 gün)</h3><table>${care.map(x=>`<tr class="click" onclick="go('at','${x.h.id}')">
    <td><b>${esc(x.h.name)}</b><div class="muted">${x.h.own?'Vadi atı':esc(owner(x.h.ownerId)?.name)}</div></td><td>${x.t}</td><td>${fmt(x.d)}</td>
    <td>${x.d<today()?'<span class="badge b-bad">Gecikti</span>':'<span class="badge b-warn">Yaklaşıyor</span>'}</td></tr>`).join('')}</table></div>`:''}
  <div class="grid g2">
    <div class="card"><h3>Bugün · ${fmt(t)}</h3>
      ${todays.length ? `<table>${todays.map(b=>{const {name,e}=bookingLabel(b);
        return `<tr><td><b>${b.time}</b></td><td>${esc(name)}<div class="muted">${lessonNo(b)}. ders / ${e?.lessons??'-'} ${b.horse?'· '+ic('horse')+' '+esc(b.horse):''} ${b.trainer?'· '+esc(b.trainer):''}</div></td>
        <td style="text-align:right;white-space:nowrap">${b.status==='plan'
          ? `<button class="btn sm" onclick="setStatus('${b.id}','tamam')">${ic('check')} Geldi</button> <button class="btn ghost sm" onclick="setStatus('${b.id}','gelmedi')">Gelmedi</button>`
          : `<span class="badge ${STATUS[b.status].c}">${STATUS[b.status].t}</span>`}
          <button class="btn ghost sm" onclick="openBooking({id:'${b.id}'})">${ic('edit')}</button></td></tr>`}).join('')}</table>`
        : `<div class="empty">Bugün paketli ders yok.</div>`}
      ${todayVisits.length?`<h3 style="margin-top:14px">Tur &amp; tek ders</h3><table>${todayVisits.map(v=>`<tr>
        <td><b>${v.time}</b></td><td>${esc(v.name)} <span class="badge b-tur">${esc(v.serviceName)}</span>
          <div class="muted">${v.people||1} kişi${v.horse?' · '+ic('horse')+' '+esc(v.horse):''}${v.trainer?' · '+esc(v.trainer):''}<span class="money"> · ${money(v.price)} ${v.paid?'✓':'(ödenmedi)'}</span></div></td>
        <td style="text-align:right;white-space:nowrap">${v.status==='plan'
          ? `<button class="btn sm" onclick="setVisit('${v.id}','tamam')">${ic('check')} Geldi</button> <button class="btn ghost sm" onclick="setVisit('${v.id}','gelmedi')">Gelmedi</button>`
          : `<span class="badge ${STATUS[v.status].c}">${STATUS[v.status].t}</span>`}
          <button class="btn ghost sm" onclick="openVisit({id:'${v.id}'})">${ic('edit')}</button></td></tr>`).join('')}</table>`:''}
    </div>
    <div class="card"><h3>⏳ Süresi yaklaşan paketler (14 gün)</h3>
      ${expiring.length ? `<table>${expiring.map(row).join('')}</table>` : `<div class="empty">Yok.</div>`}</div>
    <div class="card"><h3>${ic('down')} Az dersi kalanlar (≤2)</h3>
      ${low.length ? `<table>${low.map(row).join('')}</table>` : `<div class="empty">Yok.</div>`}</div>
    <div class="card"><h3>${ic('calendar')} Planlı dersi olmayan aktif kursiyerler</h3>
      ${unplanned.length ? `<table>${unplanned.map(row).join('')}</table>` : `<div class="empty">Herkesin planlı dersi var.</div>`}</div>
  </div>`;
}

function vTakvim(){
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  const t = today();
  return `
  <div class="row" style="margin-bottom:14px">
    <h2 style="margin:0">Takvim</h2><span class="spacer"></span>
    <button class="btn ghost sm" onclick="weekStart=addDays(weekStart,-7);render()">‹ Önceki</button>
    <button class="btn ghost sm" onclick="weekStart=mondayOf(today());render()">Bu hafta</button>
    <button class="btn ghost sm" onclick="weekStart=addDays(weekStart,7);render()">Sonraki ›</button>
    <span class="muted">${fmt(days[0])} – ${fmt(days[6])}</span>
  </div>
  <div class="week">${days.map(d=>{
    const items = [
      ...S.bookings.filter(b=>b.date===d).map(b=>({k:'b', time:b.time, x:b})),
      ...S.visits.filter(v=>v.date===d).map(v=>({k:'v', time:v.time, x:v})),
    ].sort((a,b)=>a.time.localeCompare(b.time));
    return `<div class="day ${d===t?'today':''}">
      <div class="dayhead"><span>${GUN[parse(d).getDay()]} ${fmtShort(d)}</span>
        <span><button class="btn ghost sm" title="Paketli ders ekle" onclick="openBooking({date:'${d}'})">+ Ders</button>
        <button class="btn ghost sm" title="Tur / tek ders ekle" onclick="openVisit({date:'${d}'})">+ Tur</button></span></div>
      ${items.map(({k,x:b})=>{
        if(k==='v') return `<div class="chip tur ${b.status==='iptal'?'iptal':''}" onclick="openVisit({id:'${b.id}'})"><b>${b.time} · ${esc(b.name)}</b>
          ${esc(b.serviceName)} · ${b.people||1} kişi${b.horse?' · '+esc(b.horse):''}${b.status!=='plan'?' · '+STATUS[b.status].t:''}</div>`;
        const {name,e}=bookingLabel(b);
        return `<div class="chip ${b.status}" onclick="openBooking({id:'${b.id}'})"><b>${b.time} · ${esc(name)}</b>
          ${b.status!=='iptal'?`${lessonNo(b)}/${e?.lessons??'-'}`:'iptal'}${b.horse?' · '+esc(b.horse):''}${b.trainer?' · '+esc(b.trainer):''}</div>`}).join('')}
    </div>`}).join('')}</div>
  <p class="muted">Renkler: <span class="badge b-info">Planlandı</span> <span class="badge b-ok">Tamamlandı</span> <span class="badge b-warn">Gelmedi</span> <span class="badge b-mut">İptal</span> <span class="badge b-tur">Tur / tek ders</span></p>`;
}

function vKursiyer(){
  const q = kFilter.q.toLocaleLowerCase('tr');
  const list = S.students.filter(s=> !q || (s.name+' '+(s.phone||'')).toLocaleLowerCase('tr').includes(q))
    .map(s=>{ const es = S.enrollments.filter(e=>e.studentId===s.id).sort((a,b)=>b.startDate.localeCompare(a.startDate));
      return {s, e:es[0]}; })
    .filter(({e})=> kFilter.state==='all' || (kFilter.state==='none' ? !e : e && enrollState(e).k===kFilter.state))
    .sort((a,b)=>a.s.name.localeCompare(b.s.name,'tr'));
  return `
  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Kursiyerler (${S.students.length})</h2><span class="spacer"></span>
    <button class="btn" onclick="openStudentForm()">+ Yeni kursiyer</button></div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input style="max-width:280px" placeholder="İsim / telefon ara…" value="${esc(kFilter.q)}" oninput="kFilter.q=this.value;rerenderKeepFocus(this)">
      <select style="max-width:200px" onchange="kFilter.state=this.value;render()">
        ${[['all','Tümü'],['aktif','Aktif'],['yakin','Süresi yaklaşan'],['sure','Süresi dolmuş'],['bitti','Paketi bitmiş'],['dondu','Dondurulmuş'],['none','Paketi yok']]
          .map(([v,t])=>`<option value="${v}" ${kFilter.state===v?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    ${list.length ? `<div class="tablewrap"><table class="resp"><tr><th>Ad Soyad</th><th>Telefon</th><th>Güncel paket</th><th>İlerleme</th><th>Kalan</th><th>Bitiş</th><th>Durum</th><th></th></tr>
    ${list.map(({s,e})=>{ if(!e) return `<tr class="click" onclick="openStudent('${s.id}')"><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td colspan="5" class="muted">Paket yok</td></tr>`;
      const c=counts(e), st=enrollState(e);
      return `<tr class="click" onclick="openStudent('${s.id}')"><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td>${esc(e.packageName)}</td>
        <td>${bar(e)}<div class="muted">${c.used}/${e.lessons} kullanıldı · ${c.planned} planlı</div></td>
        <td><b>${e.lessons-c.used}</b> <span class="muted">ders kaldı</span></td><td>${fmtShort(e.endDate)}</td><td><span class="badge ${st.c}">${st.t}</span></td>
        <td style="text-align:right">${e.lessons-c.used>0?`<button class="btn sm" onclick="event.stopPropagation();quickLesson('${e.id}')">${ic('check')} Ders yaptı</button>`:''}</td></tr>`}).join('')}
    </table></div>` : `<div class="empty">Kursiyer bulunamadı.</div>`}
  </div>`;
}
function rerenderKeepFocus(el){ const pos = el.selectionStart; const ph = el.placeholder; render();
  const n=[...document.querySelectorAll('input')].find(i=>i.placeholder===ph); if(n){n.focus(); n.setSelectionRange(pos,pos);} }

function vRezervasyon(){
  const q = filter.q.toLocaleLowerCase('tr');
  const list = S.bookings.filter(b=>{
    const {name} = bookingLabel(b);
    if (q && !(name+' '+(b.horse||'')+' '+(b.trainer||'')).toLocaleLowerCase('tr').includes(q)) return false;
    if (filter.status!=='all' && b.status!==filter.status) return false;
    if (filter.from && b.date<filter.from) return false;
    if (filter.to && b.date>filter.to) return false;
    return true;
  }).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return `
  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Rezervasyonlar</h2><span class="spacer"></span>
    <button class="btn" onclick="openBooking({date:today()})">+ Rezervasyon</button></div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input style="max-width:220px" placeholder="Kursiyer / at / eğitmen…" value="${esc(filter.q)}" oninput="filter.q=this.value;rerenderKeepFocus(this)">
      <select style="max-width:160px" onchange="filter.status=this.value;render()">
        <option value="all">Tüm durumlar</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${filter.status===k?'selected':''}>${v.t}</option>`).join('')}</select>
      <input type="date" style="max-width:160px" value="${filter.from}" onchange="filter.from=this.value;render()">
      <span class="muted">–</span>
      <input type="date" style="max-width:160px" value="${filter.to}" onchange="filter.to=this.value;render()">
    </div>
    ${list.length ? `<div class="tablewrap"><table class="resp"><tr><th>Tarih</th><th>Saat</th><th>Kursiyer</th><th>Ders</th><th>At</th><th>Eğitmen</th><th>Durum</th><th></th></tr>
    ${list.map(b=>{const {name,e}=bookingLabel(b);
      return `<tr><td>${fmt(b.date)}</td><td>${b.time}</td><td>${esc(name)}</td><td>${b.status==='iptal'?'-':lessonNo(b)+'/'+(e?.lessons??'-')}</td>
      <td>${esc(b.horse)}</td><td>${esc(b.trainer)}</td><td><span class="badge ${STATUS[b.status].c}">${STATUS[b.status].t}</span></td>
      <td style="text-align:right"><button class="btn ghost sm" onclick="openBooking({id:'${b.id}'})">Düzenle</button></td></tr>`}).join('')}
    </table></div>` : `<div class="empty">Rezervasyon yok.</div>`}
  </div>`;
}

    <div class="card"><h3>${ic('tag')} Çiftlik adı &amp; logo</h3>
      <label>Çiftlik adı<input value="${esc(S.settings.farmName)}" onchange="S.settings.farmName=this.value.trim()||'Vadi At Çiftliği';save();render()"></label>
      <div class="row"><div class="logo-big" style="width:72px;height:72px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:36px">${brandLogoHtml()}</div>
        <label class="btn" style="margin:0;display:inline-flex;align-items:center">Logo yükle<input type="file" accept="image/*" style="display:none" onchange="setLogo(this.files[0])"></label>
        ${S.settings.logo?`<button class="btn ghost sm" onclick="S.settings.logo='';save();render()">Kaldır</button>`:''}</div>
      <p class="muted">Şeffaf arka planlı PNG en iyi sonucu verir. Logo; üst çubukta, giriş ekranında ve uygulama simgesinde kullanılır.</p>

    <div class="card"><h3>Paketler</h3>

function createEnrollment(studentId, packageId, start, price){
  const p = pkg(packageId);
  const e = {id:uid(), studentId, packageId, packageName:p.name, lessons:p.lessons, months:p.months,
    startDate:start, endDate:addDays(addMonths(start,p.months),0), price: price ?? p.price, paid:0, note:''};
  // bitiş: başlangıç + N ay (bir gün öncesi)
  e.endDate = addDays(addMonths(start,p.months),-1);
  S.enrollments.push(e); return e;
}

    <div class="lessons">${boxes}</div>
    <div class="muted money">Ücret: ${money(e.price)} · Ödenen: ${money(e.paid)} ${kalanBorc>0?`· <b style="color:var(--bad)">Kalan: ${money(kalanBorc)}</b>`:kalanBorc<=0&&e.price?'· <span style="color:var(--ok)">Ödendi</span>':''}</div>

}

  </form>`);

function delEnroll(id){ if(!isAdmin()) return toast('Silme yetkisi sadece yöneticide'); const e=enrollment(id); const n=S.bookings.filter(b=>b.enrollmentId===id).length;

  S.bookings = S.bookings.filter(b=>b.enrollmentId!==id); S.enrollments = S.enrollments.filter(x=>x.id!==id);
  save(); render(); openStudent(e.studentId); }
function delStudent(id){ if(!isAdmin()) return toast('Silme yetkisi sadece yöneticide'); const es = S.enrollments.filter(e=>e.studentId===id).map(e=>e.id);
  if(!confirm(`${student(id).name} ve tüm paket/ders kayıtları silinsin mi? Geri alınamaz.`)) return;
  S.bookings = S.bookings.filter(b=>!es.includes(b.enrollmentId)); S.enrollments = S.enrollments.filter(e=>e.studentId!==id);
  S.students = S.students.filter(s=>s.id!==id); save(); closeModal(); render(); }

/* ---------- Rezervasyon ---------- */
function bookableEnrollments(includeId){
  return S.enrollments.filter(e=> e.id===includeId || (!['sure','dondu','bitti'].includes(enrollState(e).k) && counts(e).remaining>0))
    .map(e=>({e, s:student(e.studentId)})).filter(x=>x.s).sort((a,b)=>a.s.name.localeCompare(b.s.name,'tr'));
}
function openBooking(o){
  const b = o.id ? S.bookings.find(x=>x.id===o.id) : null;
  const d = b || {date:o.date||today(), time:'10:00', duration:S.settings.defaultDuration, enrollmentId:o.enrollmentId||'', horse:'', trainer:'', status:'plan', note:''};
  const opts = bookableEnrollments(d.enrollmentId);
  const back = o.back || (o.enrollmentId && enrollment(o.enrollmentId)?.studentId) || '';
  if(!b && !opts.length){ modal(`<h3>Rezervasyon</h3><p>Ders planlanabilecek aktif paket yok. Önce bir kursiyer ekleyip paket tanımlayın.</p>
    <div class="row"><span class="spacer"></span><button class="btn ghost" onclick="closeModal()">Kapat</button><button class="btn" onclick="openStudentForm()">+ Kursiyer</button></div>`); return; }
  modal(`<h3>${b?'Rezervasyonu düzenle':'Yeni rezervasyon'}</h3>

      <option value="">Seçin…</option>
      ${opts.map(({e,s})=>{const c=counts(e,b?.id); return `<option value="${e.id}" ${d.enrollmentId===e.id?'selected':''}>${esc(s.name)} — ${esc(e.packageName)} (${c.remaining} planlanabilir, bitiş ${fmtShort(e.endDate)})</option>`}).join('')}
    </select></label>
    <div class="two">

      <label>At<input name="horse" list="dl-h" value="${esc(d.horse)}"></label>
      <label>Eğitmen<input name="trainer" list="dl-t" value="${esc(d.trainer)}"></label>
    </div>
    <datalist id="dl-h">${lessonHorses().map(h=>`<option value="${esc(h)}">`).join('')}</datalist>
    <datalist id="dl-t">${S.trainers.map(h=>`<option value="${esc(h)}">`).join('')}</datalist>
    ${!b?`<label>Tekrarla (haftalık)<select name="repeat">${[1,2,3,4,5,6,8,10,12].map(n=>`<option value="${n}">${n===1?'Tekrar yok':n+' hafta boyunca'}</option>`).join('')}</select></label>`:''}
    <label>Not (dersin içeriği, gelişim vb.)<textarea name="note">${esc(d.note)}</textarea></label>
    <div id="bf-warn" class="muted" style="color:var(--bad)"></div>
    <div class="row">${b?`<button type="button" class="btn danger sm" onclick="delBooking('${b.id}','${back}')">Sil</button>`:''}<span class="spacer"></span>
      <button type="button" class="btn ghost" onclick="${back?`openStudent('${back}')`:'closeModal()'}">Vazgeç</button><button class="btn">Kaydet</button></div>
  </form>`);
  $('#bf').onsubmit = ev => { ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target)); if(b) f.enrollmentId = b.enrollmentId;
    const e = enrollment(f.enrollmentId); const warn = $('#bf-warn');
    if(!e) return warn.textContent='Kursiyer seçin.';
    const repeat = +(f.repeat||1);
    const dates = [...Array(repeat)].map((_,i)=>addDays(f.date,i*7));
    const c = counts(e, b?.id);
    // hak kontrolü (iptal hariç)
    const need = f.status==='iptal' ? 0 : (f.status==='gelmedi' && !S.settings.noShowCounts ? 0 : dates.length);
    const avail = e.lessons - c.used - c.planned;
    if(need > avail) return warn.textContent = `Bu pakette yalnızca ${avail} ders hakkı planlanabilir.`;
    const late = dates.filter(x=>x>e.endDate || x<e.startDate);
    if(late.length && f.status!=='iptal' && !confirm(`${late.map(fmt).join(', ')} paket geçerlilik tarihleri (${fmt(e.startDate)} – ${fmt(e.endDate)}) dışında. Yine de kaydedilsin mi?`)) return;
    const conflicts = f.status==='iptal' ? [] :
      findConflicts({dates, time:f.time, duration:f.duration, horse:f.horse, trainer:f.trainer, excludeId:b?.id, studentId:e.studentId});
    if(conflicts.length && !confirm('Çakışma var:\n\n'+conflicts.join('\n')+'\n\nYine de kaydedilsin mi?')) return;
    const data = {time:f.time, duration:+f.duration||60, status:f.status, horse:f.horse.trim(), trainer:f.trainer.trim(), note:f.note};
    if(b) Object.assign(b, data, {date:f.date});
    else dates.forEach(dt=>S.bookings.push({id:uid(), enrollmentId:e.id, date:dt, created:today(), ...data}));
    if(data.horse && !S.horses.includes(data.horse)) S.horses.push(data.horse);
    if(data.trainer && !S.trainers.includes(data.trainer)) S.trainers.push(data.trainer);
    save(); render(); back ? openStudent(back) : closeModal(); toast(dates.length>1&&!b?`${dates.length} rezervasyon oluşturuldu`:'Kaydedildi');
  };
}
/* Paketli dersler + tur/tek dersler için ortak çakışma kontrolü (aynı at, eğitmen veya kişi; örtüşen saat) */
const splitList = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function findConflicts({dates, time, duration, horse, trainer, excludeId, studentId}){
  const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
  const s1 = toMin(time), e1 = s1 + (+duration||60), myHorses = splitList(horse), out = [];
  dates.forEach(dt=>{
    const slots = [
      ...S.bookings.filter(x=>x.date===dt && x.id!==excludeId && x.status!=='iptal')
        .map(x=>({...x, who:bookingLabel(x).name, sid:enrollment(x.enrollmentId)?.studentId})),
      ...S.visits.filter(x=>x.date===dt && x.id!==excludeId && x.status!=='iptal')
        .map(x=>({...x, who:`${x.name} (${x.serviceName})`})),
    ];
    slots.forEach(x=>{
      const s2 = toMin(x.time), e2 = s2 + (+x.duration||60);
      if(!(s1<e2 && s2<e1)) return;
      splitList(x.horse).filter(h=>myHorses.includes(h)).forEach(h=>out.push(`${fmt(dt)} ${x.time}: ${h} atı ${x.who} ile dolu`));
      if(trainer && x.trainer===trainer) out.push(`${fmt(dt)} ${x.time}: ${trainer} eğitmeni ${x.who} ile dolu`);
      if(studentId && x.sid===studentId) out.push(`${fmt(dt)} ${x.time}: kursiyerin zaten dersi var`);
    });
  });
  return out;
}

/* Tek dokunuşla "ders yaptı": bugün planlı dersi varsa onu tamamlar, yoksa bugüne tamamlanmış ders ekler */
function quickLesson(eid, fromCard){
  const e = enrollment(eid), s = student(e.studentId), c = counts(e), t = today();
  if(e.lessons - c.used <= 0) return toast('Paket bitmiş, yeni paket açın');
  const planned = S.bookings.filter(b=>b.enrollmentId===eid && b.date===t && b.status==='plan').sort((a,b)=>a.time.localeCompare(b.time))[0];
  const no = c.used + 1;
  let warn = '';
  if(t > e.endDate) warn = `\n\n⚠️ Paketin süresi ${fmt(e.endDate)} tarihinde dolmuş.`;
  if(!planned && c.remaining <= 0) warn += `\n\n⚠️ Kalan tüm haklar ileri tarihlere planlanmış; bu ders eklenirse planlı derslerden birini iptal etmeniz gerekir.`;
  if(!confirm(`${s.name}\n${no}. ders (${e.lessons} dersten) olarak işlensin mi?${warn}`)) return;
  if(planned) planned.status = 'tamam';
  else { const d = new Date(); const m = Math.floor(d.getMinutes()/15)*15;
    S.bookings.push({id:uid(), enrollmentId:eid, date:t, time:`${pad(d.getHours())}:${pad(m)}`, duration:S.settings.defaultDuration,
      status:'tamam', horse:'', trainer:'', note:'', created:t, by:me()?.name||''}); }

}

ICONS.cup = '<path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9.5h1.5a2.5 2.5 0 0 1 0 5H17M7.5 5c0-1 1-1.2 1-2.5M11.5 5c0-1 1-1.2 1-2.5M4 21h13"/>';
const CAFE_AREAS = {ic:'İç alan', dis:'Dış alan (bahçe)'};
const CAFE_ST = {bekliyor:{t:'Onay bekliyor',c:'b-warn'}, onay:{t:'Onaylandı',c:'b-info'}, geldi:{t:'Geldi',c:'b-ok'}, gelmedi:{t:'Gelmedi',c:'b-mut'}, iptal:{t:'İptal',c:'b-mut'}};
const CAFE_ACTIVE = ['bekliyor','onay','geldi'];
const AY_TAM = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const tmin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return h*60+(m||0); };
const mtime = m => pad(Math.floor(m/60))+':'+pad(m%60);
const cafeTable = id => S.cafe.tables.find(t=>t.id===id);
function cafeSummer(date){ return (S.cafe.summer||[]).includes(parse(date).getMonth()+1); }
function cafeHours(date){ return cafeSummer(date) ? [S.cafe.sOpen, S.cafe.sClose] : [S.cafe.wOpen, S.cafe.wClose]; }
// Açık alanlar; yazın önce bahçe denenir
function cafeAreasOpen(date){ const a = []; if(cafeSummer(date) && !(S.cafe.outClosed||[]).includes(date)) a.push('dis'); a.push('ic'); return a; }
// Verilen saat aralığında dolu olan masalar
function cafeBusy(date, time, excludeId, dur){ const a = tmin(time), b = a + (dur || +S.cafe.stay || 120), busy = new Set();
  S.cafeRes.filter(r=>r.date===date && r.id!==excludeId && CAFE_ACTIVE.includes(r.status)).forEach(r=>{
    const ra = tmin(r.time), rb = ra + (+S.cafe.stay || 120);
    if(a < rb && ra < b) (r.tables||[]).forEach(t=>busy.add(t)); });
  return busy; }
// Önce tek masa (en küçük uygun), olmazsa büyükten küçüğe masa birleştir
function pickTables(free, people){
  const single = free.filter(t=>+t.seats>=people).sort((x,y)=>x.seats-y.seats)[0];
  if(single) return [single];
  const out = []; let sum = 0;
  for(const t of free.slice().sort((x,y)=>y.seats-x.seats)){ out.push(t); sum += +t.seats; if(sum>=people) return out; }
  return null; }
function cafeTry(date, time, people, pref, excludeId){
  const open = cafeAreasOpen(date), [o,c] = cafeHours(date);
  if(!time || tmin(time) < tmin(o) || tmin(time) >= tmin(c)) return {ok:false, msg:`Bu saatte kapalıyız (açık: ${o}–${c})`};
  if(pref && pref!=='farketmez' && !open.includes(pref))
    return {ok:false, msg: cafeSummer(date) ? 'Bu gün dış alan kapalı' : 'Kış döneminde dış alan kullanılmıyor'};
  const busy = cafeBusy(date, time, excludeId);
  for(const area of (pref && pref!=='farketmez' ? [pref] : open)){
    const pick = pickTables(S.cafe.tables.filter(t=>t.area===area && !busy.has(t.id)), people);
    if(pick) return {ok:true, area, tables:pick.map(t=>t.id), names:pick.map(t=>t.name), seats:pick.reduce((a,t)=>a + +t.seats, 0)};
  }
  return {ok:false, msg:`${people} kişi için bu saatte yeterli boş masa yok`};
}
// Bot ve "Yer var mı?" kutusu bunu kullanır: yer yoksa aynı gün en yakın uygun saatleri önerir
function cafeCheck(date, time, people, pref, excludeId){
  const r = cafeTry(date, time, people, pref, excludeId);
  if(!r.ok){ const [o,c] = cafeHours(date), alt = [];
    for(let m = Math.ceil(tmin(o)/30)*30; m < tmin(c); m += 30){ const t = mtime(m); if(t!==time && cafeTry(date, t, people, pref, excludeId).ok) alt.push(t); }
    r.alternatives = alt.sort((a,b)=>Math.abs(tmin(a)-tmin(time))-Math.abs(tmin(b)-tmin(time))).slice(0,6).sort();
  }
  return r;
}
function cafeLoad(date){ const [o,c] = cafeHours(date), open = cafeAreasOpen(date), rows = [];
  const tabs = S.cafe.tables.filter(t=>open.includes(t.area));
  for(let m = Math.floor(tmin(o)/60)*60; m < tmin(c); m += 60){ const t = mtime(m), busy = cafeBusy(date, t, null, 60);
    const used = tabs.filter(x=>busy.has(x.id));
    rows.push({t, used:used.length, total:tabs.length, ppl:S.cafeRes.filter(r=>r.date===date && CAFE_ACTIVE.includes(r.status) && tmin(r.time)<m+60 && m<tmin(r.time)+(+S.cafe.stay||120)).reduce((a,r)=>a+(+r.people||1),0)}); }
  return rows; }

function cafeToggleOut(d, closed){ const s = new Set(S.cafe.outClosed||[]); closed ? s.add(d) : s.delete(d); S.cafe.outClosed = [...s].filter(x=>x>=addDays(today(),-60)); save(); render(); }
function setCafeSt(id, st){ const r = S.cafeRes.find(x=>x.id===id); if(!r) return;
  if(st==='onay' && !(r.tables||[]).length){ const t = cafeTry(r.date, r.time, +r.people||1, r.area, r.id);

function openCafeRes(o){

  const d = r || {date:o.date||today(), time:o.time||cQ.time, people:o.people||2, area:o.area||'farketmez', name:'', phone:'', status:'onay', source:'Telefon', note:''};
  modal(`<h3>${r?'Cafe rezervasyonunu düzenle':'Yeni cafe rezervasyonu'}</h3>

    <label>Nereden geldi<select name="source">${['Telefon','Instagram','WhatsApp','Yüz yüze','Diğer'].map(x=>`<option ${d.source===x?'selected':''}>${x}</option>`).join('')}</select></label>

    box.className = 'cafe-res ' + (k.ok?'ok':'no');
    box.innerHTML = k.ok ? `Yer var: <b>${CAFE_AREAS[k.area]} · ${k.names.map(esc).join(' + ')}</b> (${k.seats} kişilik)`
      : `<b>${esc(k.msg)}.</b> ${k.alternatives?.length?'Uygun saatler: '+k.alternatives.join(', '):''}`; };
  F.oninput = upd; F.onchange = upd; upd();
  F.onsubmit = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(F));
    const data = {name:f.name.trim(), phone:f.phone.trim(), date:f.date, time:f.time, people:Math.max(1,+f.people||1), area:f.area, status:f.status, source:f.source, note:f.note.trim()};
    if(!data.name) return;
    data.tables = [];
    if(CAFE_ACTIVE.includes(data.status)){ const k = cafeTry(data.date, data.time, data.people, data.area, r?.id);

    if(r) Object.assign(r, data); else S.cafeRes.push({id:uid(), created:today(), by:me()?.name||'', ...data});
    save(); closeModal(); cDate = data.date; render(); toast('Kaydedildi'); };

function cafeBulkAdd(){ const area = $('#cb-area').value, n = Math.min(50, +$('#cb-n').value||0), s = Math.max(1, +$('#cb-s').value||4);
  const pre = area==='ic' ? 'İ' : 'D'; let k = S.cafe.tables.filter(t=>t.area===area).length;
  cafeSet(()=>{ for(let i=0;i<n;i++) S.cafe.tables.push({id:uid(), name:pre+(++k), area, seats:s}); }); }

/* ================== PANSİYON ================== */
const CHARGE_TYPES = ['Pansiyon','Veteriner','Nalbant','Aşı / İlaç','Ek yem','Antrenman / Çalıştırma','Diğer'];
const SERVICES = ['Yem','Saman / Talaş','Tımar / Bakım','Gezdirme','Padok','Antrenman'];
const owner = id => S.owners.find(x=>x.id===id);
const boarder = id => S.boarders.find(x=>x.id===id);
const pensionHorses = () => S.boarders.filter(h=>!h.own);   // müşteri (pansiyon) atları
const lessonHorses = () => [...new Set([...S.boarders.filter(h=>h.own && boarderActive(h)).map(h=>h.name), ...S.horses])];
const HORSE_ROLES = ['Okul atı','Tur atı','Manej','Yarışma','Damızlık','Genç at / eğitimde','Emekli','Satılık'];
const ym = s => s.slice(0,7);
const monthName = m => { const [y,mo]=m.split('-').map(Number); return `${['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][mo-1]} ${y}`; };
function boarderActive(h, m){ m = m || ym(today());
  return h.startDate && ym(h.startDate) <= m && (!h.endDate || ym(h.endDate) >= m); }
function ownerBalance(oid){ const hs = S.boarders.filter(h=>h.ownerId===oid).map(h=>h.id);
  return S.charges.filter(c=>hs.includes(c.horseId) && !c.paid).reduce((a,c)=>a+(+c.amount||0),0); }
function careDue(days){ const lim = addDays(today(),days), out=[];
  S.boarders.filter(h=>boarderActive(h)).forEach(h=>{
    [['nextFarrier','Nalbant'],['nextVaccine','Aşı'],['nextDeworm','Parazit'],['nextDental','Diş'],['insuranceEnd','Sigorta bitişi']].forEach(([k,t])=>{ if(h[k] && h[k]<=lim) out.push({h,t,d:h[k]}); });
  }); return out.sort((a,b)=>a.d.localeCompare(b.d)); }
let pMonth = ym(today());

function vPansiyon(){
  const active = pensionHorses().filter(h=>boarderActive(h, pMonth));
  const mc = S.charges.filter(c=>c.month===pMonth);
  const total = mc.reduce((a,c)=>a+(+c.amount||0),0), paid = mc.filter(c=>c.paid).reduce((a,c)=>a+(+c.amount||0),0);
  const missing = active.filter(h=>!mc.some(c=>c.horseId===h.id && c.type==='Pansiyon'));
  const prevM = m => { const d=parse(m+'-01'); d.setMonth(d.getMonth()-1); return ym(ymd(d)); };
  const nextM = m => { const d=parse(m+'-01'); d.setMonth(d.getMonth()+1); return ym(ymd(d)); };
  const owners = S.owners.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  return `
  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Pansiyon</h2><span class="spacer"></span>
    <button class="btn ghost" onclick="openOwnerForm()">+ At sahibi</button>
    <button class="btn" onclick="openBoarderForm(null,null,false)">+ Pansiyon atı</button></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn ghost sm" onclick="pMonth='${prevM(pMonth)}';render()">‹</button>
    <b>${monthName(pMonth)}</b>
    <button class="btn ghost sm" onclick="pMonth='${nextM(pMonth)}';render()">›</button>
    <span class="spacer"></span>
    ${missing.length?`<button class="btn sm money" onclick="genMonth('${pMonth}')">${monthName(pMonth)} pansiyon ücretlerini oluştur (${missing.length} at)</button>`:''}
  </div>
  <div class="grid g4">
    <div class="card"><div class="muted">Pansiyondaki at</div><div class="stat">${active.length}</div></div>
    <div class="card money"><div class="muted">Bu ay tahakkuk</div><div class="stat">${money(total)}</div></div>
    <div class="card money"><div class="muted">Tahsil edilen</div><div class="stat" style="color:var(--ok)">${money(paid)}</div></div>
    <div class="card money"><div class="muted">Bu ay bekleyen</div><div class="stat" style="color:${total-paid?'var(--bad)':'var(--brand)'}">${money(total-paid)}</div></div>
  </div>
  <div class="card"><h3>Atlar · ${monthName(pMonth)}</h3>
    ${active.length?`<div class="tablewrap"><table class="resp"><tr><th>At</th><th>Sahibi</th><th>Boks</th><th class="money">Aylık ücret</th><th class="money">Bu ay</th><th>Sonraki nalbant</th><th>Sonraki aşı</th></tr>
    ${active.sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(h=>{ const cs = mc.filter(c=>c.horseId===h.id);
      const pc = cs.find(c=>c.type==='Pansiyon'); const extra = cs.filter(c=>c.type!=='Pansiyon').reduce((a,c)=>a+(+c.amount||0),0);
      const st = !pc ? '<span class="badge b-mut">Oluşturulmadı</span>' : pc.paid ? '<span class="badge b-ok">Ödendi</span>' : '<span class="badge b-bad">Bekliyor</span>';
      const dd = d => !d ? '-' : `<span class="${d<today()?'badge b-bad':d<=addDays(today(),14)?'badge b-warn':''}">${fmtShort(d)}</span>`;
      return `<tr class="click" onclick="openOwner('${h.ownerId}')"><td><b>${esc(h.name)}</b><div class="muted">${esc([h.breed,h.gender].filter(Boolean).join(' · '))}</div></td>
        <td>${esc(owner(h.ownerId)?.name)}</td><td>${esc(h.box)}</td><td class="money">${money(h.monthlyFee)}</td>
        <td class="money">${st}${extra?`<div class="muted">+ ${money(extra)} ekstra</div>`:''}</td><td>${dd(h.nextFarrier)}</td><td>${dd(h.nextVaccine)}</td></tr>`}).join('')}
    </table></div>`:`<div class="empty">Bu ay pansiyonda at yok.</div>`}
  </div>
  <div class="card"><h3>At sahipleri (${owners.length})</h3>
    ${owners.length?`<div class="tablewrap"><table class="resp"><tr><th>Ad Soyad</th><th>Telefon</th><th>Atları</th><th class="money">Açık bakiye</th></tr>
    ${owners.map(o=>{const hs=S.boarders.filter(h=>h.ownerId===o.id && boarderActive(h)); const bal=ownerBalance(o.id);
      return `<tr class="click" onclick="openOwner('${o.id}')"><td><b>${esc(o.name)}</b></td><td>${esc(o.phone)}</td>
      <td>${hs.map(h=>esc(h.name)).join(', ')||'<span class="muted">-</span>'}</td>
      <td class="money">${bal?`<b style="color:var(--bad)">${money(bal)}</b>`:'<span style="color:var(--ok)">Borç yok</span>'}</td></tr>`}).join('')}
    </table></div>`:`<div class="empty">Henüz at sahibi yok.</div>`}
  </div>`;
}
function genMonth(m){
  const hs = pensionHorses().filter(h=>boarderActive(h,m) && !S.charges.some(c=>c.horseId===h.id && c.month===m && c.type==='Pansiyon'));
  hs.forEach(h=>S.charges.push({id:uid(), horseId:h.id, month:m, type:'Pansiyon', desc:monthName(m)+' pansiyon', amount:+h.monthlyFee||0, paid:false, date:today()}));
  save(); render(); toast(`${hs.length} pansiyon ücreti oluşturuldu`);
}

function payAll(oid){ const hs=S.boarders.filter(h=>h.ownerId===oid).map(h=>h.id); const bal=ownerBalance(oid);
  if(!confirm(`${money(bal)} tutarındaki tüm açık kalemler tahsil edildi olarak işaretlensin mi?`)) return;

function compressImage(file, max=1000, q=0.72){
  return new Promise((res, rej)=>{
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function setHorsePhoto(id, file){ if(!file) return;

const SESSION_KEY = 'vadi-oturum';
const MAX_USERS = 5;
const ROLES = {yonetici:'Yönetici', personel:'Personel'};
function hashPin(pin){ let h1=0xdeadbeef, h2=0x41c6ce57; const str = 'vadi:'+pin;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
function me(){ if(window.CLOUD_ON){ const r = CL.row; return r && r.rol!=='bekliyor' && CL.phase!=='giris' && CL.phase!=='onay' ? {id:r.email, name:r.ad||r.email, role:r.rol} : null; }
  let id; try{ id = localStorage.getItem(SESSION_KEY); }catch(e){ id = window._sess; } return S.users.find(u=>u.id===id) || null; }
function setSession(id){ try{ id ? localStorage.setItem(SESSION_KEY,id) : localStorage.removeItem(SESSION_KEY); }catch(e){ window._sess = id; } }
const isAdmin = () => me()?.role==='yonetici';
let login = {sel:null, pin:''};

  const sel = S.users.find(u=>u.id===login.sel);

      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}

function pinKey(n){ login.pin += n; if(login.pin.length<4) return render();

  else { login.pin=''; render(); toast('PIN hatalı'); if(navigator.vibrate) navigator.vibrate(200); } }

  const f = Object.fromEntries(new FormData(ev.target));

/* ================== ÜCRET & ÖDEMELER (yönetici) ================== */
function packageDebt(e){ return Math.max(0,(+e.price||0)-(+e.paid||0)); }
function totalReceivable(){
  return S.enrollments.reduce((a,e)=>a+packageDebt(e),0)
    + S.charges.filter(c=>!c.paid).reduce((a,c)=>a+(+c.amount||0),0)
    + S.visits.filter(v=>v.status==='tamam' && !v.paid).reduce((a,v)=>a+(+v.price||0),0);
}
function vOdemeler(){
  const m = ym(today());
  const pk = S.enrollments.filter(e=>packageDebt(e)>0).map(e=>({e,s:student(e.studentId)})).filter(x=>x.s).sort((a,b)=>a.s.name.localeCompare(b.s.name,'tr'));
  const pkTot = pk.reduce((a,x)=>a+packageDebt(x.e),0);
  const own = S.owners.map(o=>({o, bal:ownerBalance(o.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal);

    + S.charges.filter(c=>c.paid && inMonth(c.paidDate)).reduce((a,c)=>a+(+c.amount||0),0)
    + S.visits.filter(v=>v.paid && inMonth(v.paidDate)).reduce((a,v)=>a+(+v.price||0),0);

function takePackagePayment(eid){ const e = enrollment(eid); const kalan = packageDebt(e);
  const v = prompt(`${student(e.studentId).name} — kalan ${money(kalan)}\nAlınan tutar (₺):`, kalan); if(v===null) return;
  const amt = +String(v).replace(/[^\d.,]/g,'').replace(',','.'); if(!(amt>0)) return toast('Geçerli bir tutar girin');
  e.paid = (+e.paid||0) + amt; (e.payments = e.payments||[]).push({date:today(), amount:amt, by:me()?.name||''});
  save(); render(); toast(money(amt)+' tahsil edildi'); }

function stableStr(v){ if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStr).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}'; }
function h53(str){ let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
const ayarKeys = () => Object.keys(S).filter(k=>!COLLS.includes(k) && !NO_SYNC.includes(k) && !k.startsWith('_'));
function snapshot(){ const m = new Map();
  COLLS.forEach(c=>(S[c]||[]).forEach(r=>{ if(r && r.id!=null) m.set(c+'|'+r.id, h53(stableStr(r))); }));
  ayarKeys().forEach(k=>m.set('ayar|'+k, h53(stableStr(S[k]))));
  return m; }

async function fetchRows(since){
  const out = []; let from = 0;
  for(;;){ let q = CL.sb.from('kayit').select('tur,id,veri,silindi,guncel').order('sira').range(from, from+999);
    if(since) q = q.gt('guncel', since);
    const { data, error } = await q; if(error) throw error; out.push(...data); if(data.length<1000) break; from += 1000; }
  return out; }
function buildState(rows){
  const N = defaults(); COLLS.forEach(c=>N[c]=[]);
  rows.forEach(r=>{ if(r.silindi || r.veri==null) return; if(r.tur==='ayar') N[r.id] = r.veri; else if(COLLS.includes(r.tur)) N[r.tur].push(r.veri); });
  N.settings = Object.assign(defaults().settings, N.settings); N.cafe = Object.assign(defaults().cafe, N.cafe);
  N.users = S.users || [];
  return N; }
async function startSync(){
  CL.phase = 'yukleniyor'; render();
  const synced = snapLoad();
  try{
    if(synced) await pushPending(true);
    const rows = await fetchRows();
    CL.lastTs = rows.reduce((a,r)=>!a||r.guncel>a?r.guncel:a, CL.lastTs);
    if(!rows.filter(r=>!r.silindi).length){
      CL.empty = true; CL.snap = new Map(); CL.ready = false; CL.phase = 'hazir'; render(); return; }
    CL.empty = false;
    if(!synced) CL.orphans = findOrphans(rows);
    S = buildState(rows); CL.snap = snapshot(); snapSave(); localSave();
    CL.ready = true; CL.phase = 'hazir'; cloudStatus('ok'); subscribe(); render();
    if(isAdmin()) loadUsers();
  }catch(e){ console.warn(e); CL.phase = 'cevrimdisi'; cloudStatus('hata'); render(); }
}
/* Bu cihazda daha önce (ortak sisteme geçmeden) girilmiş ama bulutta olmayan kayıtlar */
function findOrphans(rows){
  const live = rows.filter(r=>!r.silindi && r.veri);
  const has = new Set(live.map(r=>r.tur+'|'+r.id));
  const byName = (tur, pred) => live.filter(r=>r.tur===tur).map(r=>r.veri).find(pred);
  const map = {}; const out = [];
  const nm = s => (s||'').toLocaleLowerCase('tr').trim();
  (S.students||[]).forEach(s=>{ if(has.has('students|'+s.id)) return; const d = byName('students', x=>nm(x.name)===nm(s.name)); if(d) map[s.id]=d.id; else out.push(['students',s]); });
  (S.owners||[]).forEach(o=>{ if(has.has('owners|'+o.id)) return; const d = byName('owners', x=>nm(x.name)===nm(o.name)); if(d) map[o.id]=d.id; else out.push(['owners',o]); });
  (S.boarders||[]).forEach(h=>{ if(has.has('boarders|'+h.id)) return; const d = byName('boarders', x=>nm(x.name)===nm(h.name) && !!x.own===!!h.own); if(d) map[h.id]=d.id; else out.push(['boarders',h]); });
  /* İsimden eşleşen (zaten bulutta olan) kursiyer/atın bağlı kayıtları aynı başlangıç verisinin kopyasıdır: eklenmez.
     Ayrıca aynı içerikli kayıt bulutta varsa (kimlik hariç) eklenmez. */
  const mapped = new Set(Object.keys(map));
  const sig = r => stableStr(Object.fromEntries(Object.entries(r).filter(([k])=>k!=='id' && k!=='created')));
  ['enrollments','bookings','visits','charges','cafeRes'].forEach(c=>{
    const cloudSigs = new Set(live.filter(r=>r.tur===c).map(r=>sig(Object.assign({}, r.veri, ...['studentId','ownerId','horseId','enrollmentId'].filter(k=>r.veri[k]).map(k=>({[k]:r.veri[k]}))))));
    (S[c]||[]).forEach(r=>{ if(has.has(c+'|'+r.id)) return;
      if(['studentId','ownerId','horseId'].some(k=>r[k] && mapped.has(r[k]))) return;
      const fixed = {...r}; ['studentId','ownerId','horseId','enrollmentId'].forEach(k=>{ if(fixed[k] && map[fixed[k]]) fixed[k]=map[fixed[k]]; });
      if(cloudSigs.has(sig(fixed))) return;
      out.push([c,r]); }); });
  if(!out.length) return null;
  const fix = r => { const x = {...r}; ['studentId','ownerId','horseId','enrollmentId'].forEach(k=>{ if(x[k] && map[x[k]]) x[k]=map[x[k]]; }); return x; };
  const recs = out.map(([c,r])=>[c, fix(r)]);
  try{ localStorage.setItem('vadi-yerel-yedek', JSON.stringify(recs)); }catch(e){}
  return recs; }
async function uploadOrphans(){
  const recs = CL.orphans || []; if(!recs.length) return;
  recs.forEach(([c,r])=>{ (S[c] = S[c]||[]).push(r); });
  CL.orphans = null; save(); render(); toast(recs.length+' kayıt ortak sisteme eklendi'); }

function subscribe(){
  if(CL.chan) return;
  CL.chan = CL.sb.channel('kayit-degisiklik').on('postgres_changes', {event:'*', schema:'public', table:'kayit'}, p=>applyRow(p.new)).subscribe();
  setInterval(pollChanges, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ pollChanges(); pushPending(); } });
  window.addEventListener('online', ()=>{ pushPending(); pollChanges(); });
}
async function pollChanges(){ if(!CL.ready) return;
  try{ const rows = await fetchRows(CL.lastTs); rows.forEach(applyRow); }catch(e){} }
let _rr = null;
function applyRow(r){ if(!r || !r.tur) return;
  if(r.guncel && (!CL.lastTs || r.guncel>CL.lastTs)) CL.lastTs = r.guncel;
  const key = r.tur+'|'+r.id;
  if(r.silindi || r.veri==null){
    if(!CL.snap.has(key)) return;
    if(r.tur==='ayar') delete S[r.id]; else if(COLLS.includes(r.tur)) S[r.tur] = (S[r.tur]||[]).filter(x=>String(x.id)!==String(r.id));
    CL.snap.delete(key);
  } else {
    const hv = h53(stableStr(r.veri)); if(CL.snap.get(key)===hv) return;
    if(r.tur==='ayar') S[r.id] = r.tur==='ayar' && r.id==='settings' ? Object.assign(defaults().settings, r.veri) : r.veri;
    else if(COLLS.includes(r.tur)){ const arr = S[r.tur] = S[r.tur]||[]; const i = arr.findIndex(x=>String(x.id)===String(r.id)); if(i>=0) arr[i] = r.veri; else arr.push(r.veri); }
    else return;
    CL.snap.set(key, hv);
  }
  snapSave(); localSave();
  clearTimeout(_rr); _rr = setTimeout(()=>{ const a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#modal-root').contains(a)) return; render(); }, 250);
}
function schedulePush(){ cloudStatus('bekliyor'); clearTimeout(CL.pushTimer); CL.pushTimer = setTimeout(pushPending, 300); }
async function pushPending(force){
  if(!CL.sb || (!CL.ready && !force) || CL.busy) return;
  CL.busy = true;
  try{
    const cur = snapshot(); const ups = [];
    const rec = key => { const [tur, ...rest] = key.split('|'); const id = rest.join('|');
      return { tur, id, veri: tur==='ayar' ? S[id] : (S[tur]||[]).find(x=>String(x.id)===id), silindi:false }; };
    cur.forEach((h,k)=>{ if(CL.snap.get(k)!==h) ups.push(rec(k)); });
    CL.snap.forEach((h,k)=>{ if(!cur.has(k)){ const [tur, ...rest] = k.split('|'); ups.push({tur, id:rest.join('|'), veri:null, silindi:true}); } });
    for(let i=0;i<ups.length;i+=200){
      const part = ups.slice(i,i+200);
      const { error } = await CL.sb.from('kayit').upsert(part, {onConflict:'tur,id'});
      if(error) throw error;
      part.forEach(u=>{ const k = u.tur+'|'+u.id; if(u.silindi) CL.snap.delete(k); else CL.snap.set(k, cur.get(k)); });
      snapSave();
    }
    cloudStatus('ok');
  }catch(e){ console.warn('gönderilemedi', e); cloudStatus('hata'); setTimeout(pushPending, 30000); }
  finally{ CL.busy = false; }
}
