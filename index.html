function trErr(m){ return /Invalid login/i.test(m) ? 'E-posta veya şifre hatalı.' : /not confirmed/i.test(m) ? 'E-posta adresi henüz onaylanmadı. E-postanızdaki bağlantıya dokunun.'
  : /already registered/i.test(m) ? 'Bu e-posta ile zaten hesap var. "Giriş yap"ı kullanın.' : /rate limit|too many/i.test(m) ? 'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.'
  : /Password should/i.test(m) ? 'Şifre en az 8 karakter olmalı.' : m; }
async function forgotPw(){ const email = ($('#clf [name=email]')?.value||'').trim(); if(!email) return toast('Önce e-posta adresinizi yazın');
  if(!CL.sb) return; const { error } = await CL.sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  toast(error ? 'Gönderilemedi: '+trErr(error.message) : 'Şifre sıfırlama e-postası gönderildi'); }
async function cloudLogout(){ if(!confirm('Çıkış yapılsın mı?')) return; try{ await CL.sb?.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem('vadi-bulut-ben'); localStorage.removeItem('vadi-bulut-snap'); }catch(e){}
  CL.row = null; CL.ready = false; CL.phase = 'giris'; closeModal(); render(); }
/* Şifre sıfırlama bağlantısından gelindiyse yeni şifre iste */
function checkRecovery(){ if(!/type=recovery/.test(location.hash)) return;
  setTimeout(()=>{ const p = prompt('Yeni şifrenizi yazın (en az 8 karakter):'); if(!p || p.length<8) return;
    CL.sb?.auth.updateUser({password:p}).then(({error})=>toast(error?'Şifre değiştirilemedi':'Şifre güncellendi')); }, 1200); }

function openCloudMe(){
  const r = CL.row||{};
  modal(`<h3>${ic(r.rol==='yonetici'?'shield':'user')} ${esc(r.ad||CL.email)}</h3>
  <div class="card"><div class="kv"><div><span>E-posta</span><b>${esc(r.email||CL.email)}</b></div><div><span>Yetki</span><b>${ROLES[r.rol]||'-'}</b></div>
    <div><span>Ortak sistem</span><b>${CL.status==='ok'?'Bağlı, tüm kayıtlar gönderildi':CL.status==='bekliyor'?'Gönderiliyor…':'Bağlantı yok; değişiklikler internet gelince gönderilecek'}</b></div></div></div>
  <div class="card"><h3>Bu cihaz</h3>
    <label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" ${wakeWanted()?'checked':''} onchange="setWake(this.checked)">
      Ekranı açık tut (tablet / ahır ekranı için)</label></div>
  <button class="btn danger" style="width:100%" onclick="cloudLogout()">Çıkış yap</button>`);
}
/* ---- yönetici: kullanıcı onayı ---- */
async function loadUsers(){ if(!CL.sb) return; const { data } = await CL.sb.from('izinli').select('*').order('olusturma');
  CL.users = data||[]; if(view==='home' || view==='ayarlar') render(); }
function cloudUsersCard(){
  if(!CL.users && !CL._lu){ CL._lu = 1; setTimeout(loadUsers, 0); }
  const us = CL.users||[];
  return `<div class="card"><h3>${ic('users')} Kullanıcılar (${us.filter(u=>u.rol!=='bekliyor').length})</h3>
    ${us.length?`<table>${us.map(u=>`<tr><td>${ic(u.rol==='yonetici'?'shield':'user')} <b>${esc(u.ad||'')}</b><div class="muted">${esc(u.email)}</div></td>
      <td style="text-align:right;white-space:nowrap">${u.email===CL.email?'<span class="badge b-warn">Yönetici (siz)</span>':`
        <select style="width:auto;min-height:36px;padding:4px 8px" onchange="setUserRole('${esc(u.email)}',this.value)">
          ${[['bekliyor','Onay bekliyor'],['personel','Personel'],['yonetici','Yönetici']].map(([k,v])=>`<option value="${k}" ${u.rol===k?'selected':''}>${v}</option>`).join('')}</select>
        <button class="btn ghost sm" onclick="delCloudUser('${esc(u.email)}')">Sil</button>`}</td></tr>`).join('')}</table>`:'<div class="muted">Yükleniyor…</div>'}
    <p class="muted">Yeni kişi uygulamayı açıp <b>Hesap oluştur</b> ile kaydolur; burada <b>Onay bekliyor</b> olarak görünür. <b>Personel</b> veya <b>Yönetici</b> seçerek onaylayın.<br>
    <b>Yönetici</b> her şeyi görür. <b>Personel</b> ders, tur, takvim ve at künyelerini kullanır; ücret ve ödemeleri göremez.</p></div>`;
}
async function setUserRole(email, rol){ const { error } = await CL.sb.from('izinli').update({rol}).eq('email', email);
  toast(error ? 'Kaydedilemedi' : 'Yetki güncellendi'); loadUsers(); }
async function delCloudUser(email){ if(!confirm(email+' erişimi kaldırılsın mı?')) return;
  const { error } = await CL.sb.from('izinli').delete().eq('email', email); toast(error ? 'Silinemedi' : 'Kaldırıldı'); loadUsers(); }

/* ---- ana sayfa kartları (bulut durumu, ilk yükleme, onay bekleyenler) ---- */
function cloudHomeCard(){
  if(!CLOUD_ON) return '';
  if(CL.phase==='cevrimdisi') return `<div class="card" style="border-left:4px solid var(--warn)"><b>İnternet bağlantısı yok</b><div class="muted">Bu cihazdaki kopya gösteriliyor. Girdiğiniz kayıtlar internet gelince ortak sisteme gönderilecek.</div></div>`;
  if(CL.empty) return isAdmin() ? `<div class="card" style="border-left:4px solid var(--warn)"><b>Ortak sistem henüz boş</b>
    <div class="muted" style="margin:4px 0 10px">Bu cihazdaki verileri (${S.students.length} kursiyer, ${S.boarders.length} at, ${S.owners.length} at sahibi) ortak sisteme yükleyin. Diğer telefonlar bu verileri görecek.
    ${!S.students.length && window._veriVar?' Önce aşağıdaki "Gerçek verileri yükle" ile kursiyerleri ekleyebilirsiniz.':''}</div>
    <button class="btn" onclick="uploadThisDevice()">Bu cihazdaki verileri yükle</button></div>`
    : `<div class="card" style="border-left:4px solid var(--warn)"><b>Ortak sistem henüz boş</b><div class="muted">Yönetici verileri yükleyince burada görünecek.</div></div>`;
  let h = '';
  if(CL.orphans?.length) h += `<div class="card" style="border-left:4px solid var(--info)"><b>Bu cihazda gönderilmemiş ${CL.orphans.length} kayıt var</b>
    <div class="muted" style="margin:4px 0 10px">Ortak sisteme geçmeden önce bu telefona girilmiş kayıtlar. Eklemek ister misiniz?</div>
    <div class="row"><button class="btn" onclick="uploadOrphans()">Ortak sisteme ekle</button><button class="btn ghost" onclick="CL.orphans=null;render()">Ekleme</button></div></div>`;
  const wait = (CL.users||[]).filter(u=>u.rol==='bekliyor');
  if(isAdmin() && wait.length) h += `<div class="card" style="border-left:4px solid var(--warn)"><b>${wait.length} kişi onay bekliyor</b>
    <div class="muted" style="margin:4px 0 10px">${wait.map(u=>esc(u.ad||u.email)).join(', ')}</div><button class="btn" onclick="go('ayarlar')">Onayla</button></div>`;
  return h;
}

/* Gerçek veriler: yayındaki şifreli dosyadan (veri.enc.json) yüklenir */
if(location.protocol.startsWith('http')) fetch('veri.enc.json',{method:'HEAD',cache:'no-store'}).then(r=>{ if(r.ok){ window._veriVar=true; if(view==='home') render(); } }).catch(()=>{});
function openRealDataForm(){
  modal(`<h3>${ic('lock')} Gerçek verileri yükle</h3>
  <p class="muted">Kursiyerler ve pansiyon atları (sahipleriyle) bu telefona eklenir. Mevcut kullanıcılar ve kayıtlar silinmez; zaten olan kayıtlar tekrar eklenmez.</p>
  <form id="rd-f"><label>Veri şifresi<input name="pw" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx"></label>
  <div id="rd-msg" class="muted"></div>
  <div class="row" style="margin-top:12px"><span class="spacer"></span><button type="button" class="btn ghost" onclick="closeModal()">Vazgeç</button><button class="btn" id="rd-btn">Yükle</button></div></form>`);
  $('#rd-f').onsubmit = async ev => { ev.preventDefault();
    const btn = $('#rd-btn'), msg = $('#rd-msg'); btn.disabled = true; btn.textContent = 'Açılıyor…'; msg.textContent = '';
    try{ const b0 = S.boarders.length, s0 = S.students.length;
      await loadRealData(ev.target.pw.value.trim().toLowerCase());
      closeModal(); render(); toast(`Yüklendi: ${S.students.length - s0} kursiyer, ${S.boarders.length - b0} at`);
    }catch(e){ btn.disabled = false; btn.textContent = 'Yükle';
      msg.innerHTML = `<span style="color:var(--bad)">${e.message==='sifre' ? 'Şifre yanlış. Tekrar deneyin.' : 'Veri dosyasına ulaşılamadı. İnternet bağlantısını kontrol edin.'}</span>`; }
  };
}
async function loadRealData(pw){
  const r = await fetch('veri.enc.json?'+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('yok');
  const j = await r.json();
  const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(j.salt), iterations:j.iter, hash:'SHA-256'}, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-CBC', false, ['decrypt']);
  let plain;
  try{ plain = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv:bits.slice(32)}, key, b64(j.data))); }
  catch(e){ throw new Error('sifre'); }
  if(!plain.startsWith('/*VADI-VERI*/')) throw new Error('sifre');
  (0, eval)(plain);
  save();
}

/* ================== BAŞLAT ================== */
(function init(){
  const [hv, ha] = (location.hash||'').slice(1).split('/');
  if(VIEWS[hv]) { view = hv; viewArg = ha || null; }
  if(location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
/* Otomatik güncelleme: açılışta ve uygulamaya her dönüşte internetteki sürümü kontrol eder,
   yeni sürüm varsa eski kopyayı silip kendini yeniler (form açıkken beklemeye alır). */
async function checkUpdate(){
  if(!location.protocol.startsWith('http')) return;
  try{
    const t = await (await fetch('./index.html?v='+Date.now(), {cache:'no-store'})).text();
    const m = t.match(/const APP_VER = '([^']+)'/); if(!m || m[1]===APP_VER) return;
    if($('#modal-root').innerHTML){ window._pendingUpdate = m[1]; return; }
    applyUpdate();
  }catch(e){}
}
async function applyUpdate(){
  let n = 0; try{ n = +sessionStorage.getItem('vadi-upd')||0; if(n >= 2) return; sessionStorage.setItem('vadi-upd', n+1); }catch(e){}
  toast('Yeni sürüm yükleniyor…');
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
  try{ for(const r of await navigator.serviceWorker.getRegistrations()) await r.update(); }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(); });
if(CLOUD_ON){ cloudInit().then(checkRecovery); }
setTimeout(checkUpdate, 1500);
  if(wakeWanted()) navigator.wakeLock?.request('screen').then(l=>wakeLock=l).catch(()=>{});
  render();
})();
</script>
